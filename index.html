<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海战模拟 3D - WWS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="game-container">
        <!-- 计分板 -->
        <div id="scoreboard">
            <div class="team-score player-team">
                <span class="team-name">友军</span>
                <span class="team-points" id="player-score">0</span>
                <span class="team-caps" id="player-caps">0</span>
            </div>
            <div class="timer-container">
                <div class="game-timer" id="game-timer">15:00</div>
                <div class="points-to-win">先达到1000分获胜</div>
            </div>
            <div class="team-score enemy-team">
                <span class="team-caps" id="enemy-caps">0</span>
                <span class="team-points" id="enemy-score">0</span>
                <span class="team-name">敌军</span>
            </div>
        </div>
        <!-- 友军舰队面板 -->
        <div id="ally-panel" class="fleet-panel ally-panel" style="display: none;">
            <div class="panel-header">友军舰队</div>
            <div id="ally-ships-list" class="ships-list"></div>
        </div>

        <!-- 敌军舰队面板 -->
        <div id="enemy-panel" class="fleet-panel enemy-panel" style="display: none;">
            <div class="panel-header">敌军舰队</div>
            <div id="enemy-ships-list" class="ships-list"></div>
        </div>

        <div id="three-container"></div>
        <canvas id="gameCanvas"></canvas>
        <!-- HUD -->
        <div id="hud">
            <div id="hp-bar-container">
                <div id="hp-bar"></div>
                <span id="hp-text">100 / 100</span>
            </div>
            <div id="weapon-info">
                <span id="weapon-name">主炮</span>
                <span id="reload-status">就绪</span>
            </div>
            <div id="speed-info">速度: <span id="speed-val">0</span> 节</div>
            <div id="score-info">击沉: <span id="score-val">0</span></div>
        </div>
        <div id="minimap-container">
            <canvas id="minimapCanvas" width="200" height="200"></canvas>
        </div>
        <div id="crosshair"></div>
        <!-- 开始界面 -->
        <div id="start-screen">
            <h1>⚓ 海战模拟 WWS</h1>
            <p>3D 实时渲染 · 还原战舰世界经典海战</p>
            
            <div class="selection-container">
                <div class="ship-select">
                    <h3>选择舰种</h3>
                    <div class="btn-group">
                        <button class="ship-btn selected" data-type="cruiser">巡洋舰</button>
                        <button class="ship-btn" data-type="battleship">战列舰</button>
                        <button class="ship-btn" data-type="destroyer">驱逐舰</button>
                        <button class="ship-btn" data-type="carrier">航空母舰</button>
                    </div>
                </div>
                
                <div class="map-select">
                    <h3>选择战场</h3>
                    <div class="btn-group">
                        <button class="map-btn selected" data-map="islands" title="岛屿密布的热带海域">海岛</button>
                        <button class="map-btn" data-map="polar" title="冰川环绕的寒冷海域">北极光</button>
                        <button class="map-btn" data-map="sleeping_giant" title="火山岛屿群">沉睡的巨人</button>
                        <button class="map-btn" data-map="fire_archipelago" title="活跃的火山群岛">火焰群岛</button>
                        <button class="map-btn" data-map="desert_oasis" title="沙漠中的绿洲海域">荒漠之泪</button>
                    </div>
                    <p class="map-desc">岛屿密布的热带海域，适合伏击和近战</p>
                </div>
                
                <div class="mode-select" style="margin-top: 15px; text-align: center;">
                    <label style="color: #ccc; cursor: pointer; font-size: 16px;">
                        <input type="checkbox" id="spectator-check" style="width: 18px; height: 18px; vertical-align: middle;"> 
                        <span style="vertical-align: middle; margin-left: 5px;">观战模式 (AI vs AI)</span>
                    </label>
                </div>
            </div>
            
            <button id="start-btn">开始战斗</button>
            <div class="controls-hint">
                <p>WASD - 移动 | 鼠标 - 瞄准 | 左键 - 开火/攻击</p>
                <p>1 - 主炮 | 2 - 鱼雷 | Shift - 瞄准镜 | R - 维修 | [ ] - 切换舰船</p>
                <p>航母: 1/2/3 - 起飞 | W/S - 加减速 | 左键 - 投弹 | F - 召回</p>
            </div>
        </div>
        <!-- 结束界面 -->
        <div id="end-screen" class="hidden">
            <h1 id="end-title">战斗结束</h1>
            <p id="end-stats"></p>
            <button id="restart-btn">再来一局</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
